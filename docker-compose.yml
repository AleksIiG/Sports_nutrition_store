version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "5000:5000" # зовнішній 5000 -> внутрішній 5000
    depends_on:
      - db
      - redis
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: sports_nutrition_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 8065537
      REDIS_HOST: redis
      REDIS_PORT: 6379

  frontend:
    build: ./frontend
    ports:
      - "5173:80" # зовнішній 5173 -> внутрішній 80 (nginx)
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: "http://localhost:5000/api" # щоб фронт знав де бекенд

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sports_nutrition_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 8065537
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sports_nutrition_store"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
